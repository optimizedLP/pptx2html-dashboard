<!DOCTYPE html>
<html>
<head>
    <title>PPTX to HTML Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <h1>PPTX → HTML Dashboard</h1>
    <form action="/" method="post" enctype="multipart/form-data">
        <input type="file" name="pptx_file" accept=".pptx" required>
        <button type="submit">Convert</button>
    </form>

    {% if html_file %}
        <h2>Preview:</h2>
        <iframe src="{{ url_for('output', filename=html_file) }}" width="100%" height="600px"></iframe>
        <br>
        <a href="{{ url_for('output', filename=html_file) }}" download>Download HTML</a>
    {% endif %}
</body>
</html>
